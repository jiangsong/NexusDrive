name: Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write
  packages: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make format-check
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout 300s
      - name: Build release assets
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - name: Verify embedded versions
        run: |
          binary="dist/cloudfs_${GITHUB_REF_NAME#v}_linux_amd64"
          test "$("$binary" version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --draft
      - name: Publish multi-platform image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --tag "$image:${GITHUB_REF_NAME#v}" \
            --tag "$image:latest" \
            --push .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
